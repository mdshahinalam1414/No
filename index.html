<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noir Elysium — Where Desire Meets Elegance</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap');

:root {
  --ink: #efe7da;
  --ink-dim: #a89f92;
  --bg: #141110;
  --bg-panel: #1c1815;
  --line: #34302b;
  --gold: #c9a24b;
  --wine: #6e2436;
  --radius: 2px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: 'Work Sans', sans-serif; font-size: 16px; line-height: 1.6;
}
h1, h2, h3, .display { font-family: 'Fraunces', serif; font-weight: 600; line-height: 1.1; margin: 0; }
a { color: inherit; }
img { max-width: 100%; display: block; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; }

/* Masthead */
.masthead { text-align: center; padding: 64px 20px 40px; border-bottom: 1px solid var(--line); }
.masthead .wordmark { font-size: clamp(2.6rem, 6vw, 4.6rem); letter-spacing: 0.01em; cursor: pointer; }
.masthead .slogan { font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; color: var(--gold); margin-top: 10px; font-size: 1.05rem; }
.masthead nav { margin-top: 26px; display: flex; justify-content: center; gap: 28px; font-size: 0.88rem; color: var(--ink-dim); }
.masthead nav a { text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 2px; transition: border-color 0.2s ease, color 0.2s ease; cursor: pointer; }
.masthead nav a:hover { color: var(--gold); border-color: var(--gold); }

/* Feature */
.feature { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 0; border-bottom: 1px solid var(--line); }
.feature .photo { aspect-ratio: 4 / 5; overflow: hidden; background: var(--bg-panel); }
.feature .photo img { width: 100%; height: 100%; object-fit: cover; }
.feature .copy { padding: 56px 48px; display: flex; flex-direction: column; justify-content: center; }
.feature .kicker { color: var(--gold); font-size: 0.8rem; letter-spacing: 0.06em; margin-bottom: 14px; }
.feature h2 { font-size: clamp(1.8rem, 3vw, 2.6rem); }
.feature .tagline { font-style: italic; color: var(--ink-dim); margin-top: 12px; font-size: 1.05rem; }
.feature p.bio { margin-top: 20px; max-width: 62ch; color: #cfc7ba; }
.feature .btn { margin-top: 26px; align-self: flex-start; }

/* Grid */
.grid-section { padding: 56px 0 80px; }
.grid-section .section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 32px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
.grid-section .section-head h2 { font-size: 1.6rem; }
.profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px 32px; }
.profile-card { text-decoration: none; color: inherit; display: block; cursor: pointer; }
.profile-card .photo { aspect-ratio: 3 / 4; overflow: hidden; background: var(--bg-panel); margin-bottom: 14px; }
.profile-card .photo img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
.profile-card:hover .photo img { transform: scale(1.04); }
.profile-card .name { font-size: 1.25rem; }
.profile-card .role { color: var(--ink-dim); font-size: 0.88rem; margin-top: 4px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border: 1px solid var(--gold); color: var(--gold); text-decoration: none; font-size: 0.88rem; border-radius: var(--radius); background: transparent; cursor: pointer; transition: background 0.2s ease, color 0.2s ease; font-family: 'Work Sans', sans-serif; }
.btn:hover { background: var(--gold); color: #14100f; }
.btn.solid { background: var(--gold); color: #14100f; }
.btn.solid:hover { background: #dcb669; }
.btn.wine { border-color: var(--wine); color: #e7a6b3; }
.btn.wine:hover { background: var(--wine); color: var(--ink); }

/* Profile detail */
.profile-header { padding: 48px 0 8px; border-bottom: 1px solid var(--line); }
.profile-header .back { color: var(--ink-dim); text-decoration: none; font-size: 0.85rem; cursor: pointer; }
.profile-header .back:hover { color: var(--gold); }
.profile-header h1 { font-size: clamp(2.2rem, 4vw, 3.2rem); margin-top: 18px; }
.profile-header .role { color: var(--gold); margin-top: 6px; }
.profile-header .bio { max-width: 68ch; margin-top: 18px; color: #cfc7ba; }
.profile-header .actions { margin: 26px 0 40px; display: flex; gap: 14px; flex-wrap: wrap; }
.media-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 40px 0 30px; }
.media-item { position: relative; }
.media-item .photo { aspect-ratio: 4/5; overflow: hidden; background: var(--bg-panel); }
.media-item .photo img { width: 100%; height: 100%; object-fit: cover; }
.media-item .dl { position: absolute; bottom: 10px; right: 10px; background: rgba(20,17,16,0.82); border: 1px solid var(--gold); color: var(--gold); font-size: 0.72rem; padding: 6px 10px; text-decoration: none; border-radius: var(--radius); }
.media-item .dl:hover { background: var(--gold); color: #14100f; }
.video-block { padding: 10px 0 60px; }
.video-block h3 { font-size: 1.1rem; margin-bottom: 16px; color: var(--gold); }
.video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
.video-item video { width: 100%; background: #000; display: block; }
.video-item .actions { margin-top: 10px; }

footer { border-top: 1px solid var(--line); padding: 30px 0 50px; text-align: center; color: var(--ink-dim); font-size: 0.82rem; }
footer a { color: var(--gold); text-decoration: none; cursor: pointer; }

/* Admin */
.admin-shell { max-width: 720px; margin: 0 auto; padding: 60px 24px 100px; }
.admin-shell h1 { font-size: 2rem; margin-bottom: 6px; }
.admin-shell .sub { color: var(--ink-dim); margin-bottom: 40px; }
.login-box { max-width: 380px; margin: 80px auto; padding: 36px; background: var(--bg-panel); border: 1px solid var(--line); }
.login-box h1 { font-size: 1.6rem; margin-bottom: 20px; text-align: center; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 0.82rem; color: var(--ink-dim); margin-bottom: 6px; }
.field input, .field textarea { width: 100%; background: #0f0d0c; border: 1px solid var(--line); color: var(--ink); padding: 11px 12px; font-family: 'Work Sans', sans-serif; font-size: 0.95rem; border-radius: var(--radius); }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--gold); }
.field textarea { min-height: 90px; resize: vertical; }
.field .hint { color: var(--ink-dim); font-size: 0.76rem; margin-top: 5px; }
.gallery-repeat { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
.gallery-repeat .row { display: flex; gap: 8px; }
.gallery-repeat .row input { flex: 1; }
.gallery-repeat .row button { flex-shrink: 0; }
.form-actions { display: flex; gap: 12px; margin-top: 28px; }
.admin-list { margin-top: 50px; border-top: 1px solid var(--line); padding-top: 30px; }
.admin-row { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.admin-row img { width: 52px; height: 65px; object-fit: cover; }
.admin-row .meta { flex: 1; }
.admin-row .meta .n { font-family: 'Fraunces', serif; font-size: 1.05rem; }
.admin-row .meta .r { color: var(--ink-dim); font-size: 0.82rem; }
.admin-row .row-actions { display: flex; gap: 8px; }
.admin-row .row-actions button { background: none; border: 1px solid var(--line); color: var(--ink-dim); padding: 6px 12px; font-size: 0.78rem; cursor: pointer; border-radius: var(--radius); font-family: 'Work Sans', sans-serif; }
.admin-row .row-actions button:hover { border-color: var(--gold); color: var(--gold); }
.admin-row .row-actions button.danger:hover { border-color: var(--wine); color: #e7a6b3; }
.notice { padding: 12px 16px; border: 1px solid var(--gold); color: var(--gold); font-size: 0.85rem; margin-bottom: 24px; border-radius: var(--radius); display: none; }
.notice.show { display: block; }
.empty-state { padding: 60px 20px; text-align: center; color: var(--ink-dim); border: 1px dashed var(--line); }

@media (max-width: 860px) {
  .feature { grid-template-columns: 1fr; }
  .feature .copy { padding: 36px 24px; }
  .profile-grid { grid-template-columns: repeat(2, 1fr); }
  .media-grid { grid-template-columns: repeat(2, 1fr); }
  .video-grid { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .profile-grid { grid-template-columns: 1fr 1fr; gap: 24px 16px; }
  .media-grid { grid-template-columns: 1fr; }
  .video-grid { grid-template-columns: 1fr; }
  .masthead nav { gap: 18px; flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="masthead">
  <div class="wordmark" onclick="location.hash='#home'">Noir Elysium</div>
  <div class="slogan">Where Desire Meets Elegance</div>
  <nav>
    <a onclick="location.hash='#home'">Featured</a>
    <a onclick="location.hash='#all'">All Profiles</a>
    <a onclick="location.hash='#admin'">Admin</a>
  </nav>
</header>

<main id="app"></main>

<footer>
  Noir Elysium &middot; a self-hosted magazine &middot; <a onclick="location.hash='#admin'">Admin login</a>
</footer>

<script>
/* ============ DATA LAYER ============
   Storage: browser localStorage. This is a static single-file site with no
   server, so every visitor's browser keeps its own copy. Changes made in
   the admin panel are only visible on the device/browser where they were
   made, unless you swap Store/Auth below for a real backend (e.g. Firebase).
*/
const STORE_KEY = 'noir-elysium:profiles';
const AUTH_KEY = 'noir-elysium:auth';

const SEED_PROFILES = [
  {
    id: 'elena-voss',
    name: 'Elena Voss',
    role: 'Leading actress, stage & screen',
    tagline: 'The quiet before every storm she plays.',
    bio: "Elena Voss built her name on roles that sit still in the middle of chaos — the negotiator, the widow, the last witness. Trained in Kraków and Paris, she treats every scene like a piece of music with one note left unplayed.",
    cover: 'https://picsum.photos/seed/elena-voss/900/1200',
    gallery: [
      'https://picsum.photos/seed/elena-voss-1/1000/1250',
      'https://picsum.photos/seed/elena-voss-2/1000/1250',
      'https://picsum.photos/seed/elena-voss-3/1000/1250'
    ],
    videos: [
      'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
      'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/bigbuckbunny.mp4'
    ],
    featured: true
  },
  {
    id: 'amara-chen',
    name: 'Amara Chen',
    role: 'Actress & theatre director',
    tagline: 'Every role, a small act of defiance.',
    bio: "Amara Chen moves between the director's chair and the frame without ever losing her footing. Her recent work reframes classic tragedy through a distinctly modern, unsentimental lens.",
    cover: 'https://picsum.photos/seed/amara-chen/900/1200',
    gallery: [
      'https://picsum.photos/seed/amara-chen-1/1000/1250',
      'https://picsum.photos/seed/amara-chen-2/1000/1250'
    ],
    videos: [],
    featured: false
  },
  {
    id: 'sofia-delacroix',
    name: 'Sofia Delacroix',
    role: 'Actress, model',
    tagline: 'Elegance is just discipline in good light.',
    bio: "Sofia Delacroix crossed from the runway to the screen and brought her sense of composure with her. Critics call her stillness her most dramatic instrument.",
    cover: 'https://picsum.photos/seed/sofia-delacroix/900/1200',
    gallery: [
      'https://picsum.photos/seed/sofia-delacroix-1/1000/1250',
      'https://picsum.photos/seed/sofia-delacroix-2/1000/1250',
      'https://picsum.photos/seed/sofia-delacroix-3/1000/1250'
    ],
    videos: [],
    featured: false
  }
];

const Store = {
  all() {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) {
      localStorage.setItem(STORE_KEY, JSON.stringify(SEED_PROFILES));
      return [...SEED_PROFILES];
    }
    try { return JSON.parse(raw); } catch (e) { return []; }
  },
  save(profiles) { localStorage.setItem(STORE_KEY, JSON.stringify(profiles)); },
  get(id) { return this.all().find(p => p.id === id) || null; },
  upsert(profile) {
    const profiles = this.all();
    const idx = profiles.findIndex(p => p.id === profile.id);
    if (idx >= 0) profiles[idx] = profile; else profiles.push(profile);
    this.save(profiles);
  },
  remove(id) { this.save(this.all().filter(p => p.id !== id)); },
  resetToSeed() { this.save([...SEED_PROFILES]); }
};

function slugify(name) {
  return name.toLowerCase().trim().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-');
}

/* Light client-side gate only — NOT real security. Anyone reading the page
   source can see this password. Change it before publishing. */
const ADMIN_PASSWORD = 'noir2026';

const Auth = {
  isLoggedIn() { return sessionStorage.getItem(AUTH_KEY) === 'yes'; },
  login(password) {
    if (password === ADMIN_PASSWORD) { sessionStorage.setItem(AUTH_KEY, 'yes'); return true; }
    return false;
  },
  logout() { sessionStorage.removeItem(AUTH_KEY); }
};

/* Shown in place of any photo that fails to load — e.g. if a placeholder
   image service is blocked on the visitor's network, or a saved URL is
   broken. Keeps the layout intact instead of showing a broken-image icon. */
const IMG_FALLBACK_SVG = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500">
     <rect width="100%" height="100%" fill="#1c1815"/>
     <text x="50%" y="50%" fill="#a89f92" font-family="sans-serif" font-size="16" text-anchor="middle">Image unavailable</text>
   </svg>`
);
window.imgFallback = function(el) {
  el.onerror = null;
  el.src = IMG_FALLBACK_SVG;
};

/* ============ ROUTER ============ */
const app = document.getElementById('app');

function route() {
  const hash = location.hash || '#home';
  if (hash.startsWith('#profile/')) {
    renderProfile(decodeURIComponent(hash.split('/')[1]));
  } else if (hash === '#all') {
    renderHome(true);
  } else if (hash === '#admin') {
    renderAdmin();
  } else {
    renderHome(false);
  }
  window.scrollTo({ top: 0 });
}
window.addEventListener('hashchange', route);

/* ============ HOME + GRID ============ */
function renderHome(jumpToGrid) {
  const profiles = Store.all();
  const featured = profiles.find(p => p.featured) || profiles[0];

  const featureHtml = featured ? `
    <section class="feature">
      <div class="photo"><img src="${featured.cover}" alt="${featured.name}" onerror="imgFallback(this)"></div>
      <div class="copy">
        <div class="kicker">This issue's feature</div>
        <h2>${featured.name}</h2>
        <div class="tagline">${featured.tagline || ''}</div>
        <p class="bio">${featured.bio || ''}</p>
        <a class="btn solid" onclick="location.hash='#profile/${encodeURIComponent(featured.id)}'">Read the profile</a>
      </div>
    </section>
  ` : `<section class="feature"><div class="copy"><p>No profiles yet. Add one from <a onclick="location.hash='#admin'">Admin</a>.</p></div></section>`;

  const gridHtml = profiles.length === 0
    ? `<div class="empty-state">No profiles yet. Head to <a onclick="location.hash='#admin'">Admin</a> to add the first one.</div>`
    : profiles.map(p => `
        <a class="profile-card" onclick="location.hash='#profile/${encodeURIComponent(p.id)}'">
          <div class="photo"><img src="${p.cover}" alt="${p.name}" loading="lazy" onerror="imgFallback(this)"></div>
          <div class="name">${p.name}</div>
          <div class="role">${p.role || ''}</div>
        </a>
      `).join('');

  app.innerHTML = `
    ${featureHtml}
    <section class="grid-section wrap" id="allSection">
      <div class="section-head"><h2>All Profiles</h2></div>
      <div class="profile-grid">${gridHtml}</div>
    </section>
  `;
  if (jumpToGrid) document.getElementById('allSection').scrollIntoView({ behavior: 'smooth' });
}

/* ============ PROFILE DETAIL ============ */
function renderProfile(id) {
  const profile = Store.get(id);
  if (!profile) {
    app.innerHTML = `
      <div class="wrap profile-header">
        <a class="back" onclick="location.hash='#home'">&larr; Back to Noir Elysium</a>
        <h1>Profile not found</h1>
        <p class="bio">This profile may have been removed. Return to <a onclick="location.hash='#home'">home</a>.</p>
      </div>
    `;
    return;
  }

  const galleryHtml = (profile.gallery || []).map((url, i) => `
    <div class="media-item">
      <div class="photo"><img src="${url}" alt="${profile.name} photo ${i + 1}" loading="lazy" onerror="imgFallback(this)"></div>
      <a class="dl" href="${url}" download target="_blank" rel="noopener">Download</a>
    </div>
  `).join('');

  const videos = profile.videos || (profile.video ? [profile.video] : []);
  const videoHtml = videos.length ? `
    <section class="video-block">
      <h3>Videos</h3>
      <div class="video-grid">
        ${videos.map((url, i) => `
          <div class="video-item">
            <video controls preload="metadata" poster="${profile.cover}">
              <source src="${url}">
              Your browser doesn't support embedded video.
            </video>
            <div class="actions">
              <a class="btn wine" href="${url}" download target="_blank" rel="noopener">Download video ${i + 1}</a>
            </div>
          </div>
        `).join('')}
      </div>
    </section>
  ` : '';

  app.innerHTML = `
    <div class="wrap">
      <div class="profile-header">
        <a class="back" onclick="location.hash='#home'">&larr; Back to Noir Elysium</a>
        <h1>${profile.name}</h1>
        <div class="role">${profile.role || ''}</div>
        <p class="bio">${profile.bio || ''}</p>
        <div class="actions">
          <a class="btn solid" href="${profile.cover}" download target="_blank" rel="noopener">Download cover photo</a>
        </div>
      </div>
      <div class="media-grid">${galleryHtml}</div>
      ${videoHtml}
    </div>
  `;
}

/* ============ ADMIN ============ */
function renderAdmin() {
  if (!Auth.isLoggedIn()) {
    app.innerHTML = `
      <div class="login-box">
        <h1>Admin login</h1>
        <div class="field">
          <label for="pw">Password</label>
          <input type="password" id="pw" placeholder="Enter admin password">
        </div>
        <div class="field hint" id="loginError" style="color:#e7a6b3; display:none;">Incorrect password.</div>
        <button class="btn solid" style="width:100%; justify-content:center;" id="loginBtn">Log in</button>
      </div>
    `;
    const pwInput = document.getElementById('pw');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    loginBtn.addEventListener('click', () => {
      if (Auth.login(pwInput.value)) { renderAdmin(); }
      else { loginError.style.display = 'block'; }
    });
    pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); });
    pwInput.focus();
    return;
  }

  app.innerHTML = `
    <div class="admin-shell">
      <h1 id="formTitle">Add a profile</h1>
      <div class="sub">Photos and video are added as web links (paste an image/video URL). <a id="logoutLink" onclick="return false;">Log out</a></div>
      <div class="notice" id="notice"></div>
      <form id="profileForm">
        <input type="hidden" id="f-id">
        <div class="field"><label for="f-name">Name</label><input type="text" id="f-name" required></div>
        <div class="field"><label for="f-role">Role / credit line</label><input type="text" id="f-role" placeholder="e.g. Leading actress, stage & screen"></div>
        <div class="field"><label for="f-tagline">Tagline</label><input type="text" id="f-tagline" placeholder="A short, magazine-style line"></div>
        <div class="field"><label for="f-bio">Bio</label><textarea id="f-bio"></textarea></div>
        <div class="field">
          <label for="f-cover">Cover photo URL</label>
          <input type="url" id="f-cover" placeholder="https://...">
          <div class="hint">Shown on the home page and profile header.</div>
        </div>
        <div class="field">
          <label>Gallery photo URLs</label>
          <div class="gallery-repeat" id="galleryRepeat"></div>
          <button type="button" class="btn" id="addGalleryRow">+ Add photo</button>
        </div>
        <div class="field">
          <label>Video URLs (mp4 links, optional)</label>
          <div class="gallery-repeat" id="videoRepeat"></div>
          <button type="button" class="btn" id="addVideoRow">+ Add video</button>
        </div>
        <div class="field"><label><input type="checkbox" id="f-featured" style="width:auto; display:inline-block; margin-right:8px;">Feature on home page</label></div>
        <div class="form-actions">
          <button type="submit" class="btn solid">Save profile</button>
          <button type="button" class="btn" id="clearFormBtn">Clear form</button>
        </div>
      </form>
      <div class="admin-list">
        <h2 style="font-size:1.2rem; margin-bottom:6px;">Existing profiles</h2>
        <div id="listArea"></div>
      </div>
    </div>
  `;

  document.getElementById('logoutLink').addEventListener('click', () => { Auth.logout(); renderAdmin(); });

  const form = document.getElementById('profileForm');
  const galleryRepeat = document.getElementById('galleryRepeat');
  const videoRepeat = document.getElementById('videoRepeat');
  const notice = document.getElementById('notice');
  const formTitle = document.getElementById('formTitle');

  function addGalleryRow(value = '') {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<input type="url" class="gallery-url" placeholder="https://..." value="${value}"><button type="button" class="btn">Remove</button>`;
    row.querySelector('button').addEventListener('click', () => row.remove());
    galleryRepeat.appendChild(row);
  }
  document.getElementById('addGalleryRow').addEventListener('click', () => addGalleryRow());

  function addVideoRow(value = '') {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<input type="url" class="video-url" placeholder="https://.../video.mp4" value="${value}"><button type="button" class="btn">Remove</button>`;
    row.querySelector('button').addEventListener('click', () => row.remove());
    videoRepeat.appendChild(row);
  }
  document.getElementById('addVideoRow').addEventListener('click', () => addVideoRow());

  function resetForm() {
    form.reset();
    document.getElementById('f-id').value = '';
    galleryRepeat.innerHTML = '';
    addGalleryRow();
    videoRepeat.innerHTML = '';
    addVideoRow();
    formTitle.textContent = 'Add a profile';
  }
  document.getElementById('clearFormBtn').addEventListener('click', resetForm);
  resetForm();

  function showNotice(msg) {
    notice.textContent = msg;
    notice.classList.add('show');
    setTimeout(() => notice.classList.remove('show'), 3000);
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('f-name').value.trim();
    if (!name) return;

    let id = document.getElementById('f-id').value;
    if (!id) {
      id = slugify(name);
      let candidate = id, n = 2;
      while (Store.get(candidate)) { candidate = `${id}-${n++}`; }
      id = candidate;
    }

    const gallery = Array.from(galleryRepeat.querySelectorAll('.gallery-url')).map(i => i.value.trim()).filter(Boolean);
    const videos = Array.from(videoRepeat.querySelectorAll('.video-url')).map(i => i.value.trim()).filter(Boolean);

    const profile = {
      id, name,
      role: document.getElementById('f-role').value.trim(),
      tagline: document.getElementById('f-tagline').value.trim(),
      bio: document.getElementById('f-bio').value.trim(),
      cover: document.getElementById('f-cover').value.trim() || 'https://picsum.photos/seed/' + id + '/900/1200',
      gallery,
      videos,
      featured: document.getElementById('f-featured').checked
    };

    if (profile.featured) {
      const all = Store.all().map(p => p.id === id ? p : { ...p, featured: false });
      Store.save(all);
    }

    Store.upsert(profile);
    showNotice(`Saved "${profile.name}".`);
    resetForm();
    renderList();
  });

  window.editProfile = function(id) {
    const p = Store.get(id);
    if (!p) return;
    document.getElementById('f-id').value = p.id;
    document.getElementById('f-name').value = p.name || '';
    document.getElementById('f-role').value = p.role || '';
    document.getElementById('f-tagline').value = p.tagline || '';
    document.getElementById('f-bio').value = p.bio || '';
    document.getElementById('f-cover').value = p.cover || '';
    document.getElementById('f-featured').checked = !!p.featured;
    galleryRepeat.innerHTML = '';
    (p.gallery && p.gallery.length ? p.gallery : ['']).forEach(url => addGalleryRow(url));
    videoRepeat.innerHTML = '';
    const existingVideos = p.videos && p.videos.length ? p.videos : (p.video ? [p.video] : ['']);
    existingVideos.forEach(url => addVideoRow(url));
    formTitle.textContent = `Editing "${p.name}"`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.deleteProfile = function(id) {
    const p = Store.get(id);
    if (!p) return;
    if (!confirm(`Delete "${p.name}"? This can't be undone.`)) return;
    Store.remove(id);
    showNotice(`Deleted "${p.name}".`);
    renderList();
  };

  function renderList() {
    const listArea = document.getElementById('listArea');
    const profiles = Store.all();
    if (profiles.length === 0) {
      listArea.innerHTML = `<div class="empty-state">No profiles yet. Use the form above to add the first one.</div>`;
      return;
    }
    listArea.innerHTML = profiles.map(p => `
      <div class="admin-row">
        <img src="${p.cover}" alt="${p.name}" onerror="imgFallback(this)">
        <div class="meta">
          <div class="n">${p.name}${p.featured ? ' — featured' : ''}</div>
          <div class="r">${p.role || ''}</div>
        </div>
        <div class="row-actions">
          <button onclick="editProfile('${p.id}')">Edit</button>
          <button class="danger" onclick="deleteProfile('${p.id}')">Delete</button>
        </div>
      </div>
    `).join('');
  }
  renderList();
}

route();
</script>
</body>
</html>
